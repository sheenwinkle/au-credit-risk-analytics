[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "au-credit-risk-analytics"
version = "0.6.1"
description = "Credit risk modelling and analytics portfolio project for Australian banking and FinTech risk roles."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "joblib>=1.3",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.1",
    "plotly>=5.24",
    "scikit-learn>=1.4",
    "seaborn>=0.13",
    "sqlalchemy>=2.0",
    "streamlit>=1.39",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]
postgres = [
    "psycopg[binary]>=3.1",
]

[project.scripts]
credit-risk-train = "credit_risk_au.train:main"
credit-risk-portfolio = "credit_risk_au.portfolio:main"
credit-risk-analyse = "credit_risk_au.analytics:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
